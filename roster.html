<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Extension — Roster (Private)</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Display:wght@500;700;800&family=Hanken+Grotesk:wght@300;400;500;600&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#080706; --panel:#0e0a07; --amber:#f0a23c; --amber-hi:#ffca7a;
    --warm:#f4eee4; --ink-soft:#c9c1b4; --ink-mut:#8a8175; --line:rgba(244,238,228,.12);
    --font-display:'Big Shoulders Display',sans-serif; --font-body:'Hanken Grotesk',sans-serif; --font-mono:'Space Mono',monospace;
    --ease:cubic-bezier(.22,1,.36,1);
  }
  *{box-sizing:border-box} html{-webkit-text-size-adjust:100%}
  body{margin:0;background:var(--bg);color:var(--warm);font-family:var(--font-body);font-weight:300;line-height:1.5;
    background-image:radial-gradient(120% 90% at 50% -10%,#120d0a,#080706 60%);min-height:100vh;}
  a{color:inherit} .mono{font-family:var(--font-mono)}
  .top{position:sticky;top:0;z-index:20;background:rgba(8,7,6,.86);backdrop-filter:blur(10px);border-bottom:1px solid var(--line);}
  .top__row{display:flex;align-items:center;gap:18px;padding:14px clamp(16px,3vw,34px);flex-wrap:wrap;}
  .brand{display:flex;align-items:center;gap:12px;} .brand img{height:16px;width:auto;display:block}
  .brand__tag{font-family:var(--font-mono);font-size:10px;letter-spacing:.16em;text-transform:uppercase;color:var(--amber);
    border:1px solid var(--line);border-left:2px solid var(--amber);padding:.35em .6em;border-radius:4px;white-space:nowrap}
  .search{flex:1 1 320px;min-width:220px;position:relative;}
  .search input{width:100%;background:var(--panel);border:1px solid var(--line);border-radius:8px;color:var(--warm);
    font-family:var(--font-body);font-size:15px;padding:.7em 2.4em .7em 1em;}
  .search input:focus{outline:none;border-color:var(--amber)}
  .search::before{content:"";position:absolute;right:14px;top:50%;width:13px;height:13px;transform:translateY(-50%);border:1.6px solid var(--ink-mut);border-radius:50%;}
  .top__actions{display:flex;gap:8px;align-items:center;}
  .btn{font-family:var(--font-mono);font-size:11px;letter-spacing:.1em;text-transform:uppercase;cursor:pointer;background:none;border:1px solid var(--line);color:var(--ink-soft);border-radius:6px;padding:.7em 1em;transition:.2s;}
  .btn:hover{border-color:var(--amber);color:var(--warm)} .btn--amber{border-color:var(--amber);color:var(--amber-hi)}
  .wrap{display:grid;grid-template-columns:266px 1fr;gap:0;align-items:start;}
  @media(max-width:860px){ .wrap{grid-template-columns:1fr} .side{position:static !important;border-right:none;border-bottom:1px solid var(--line)} }
  .side{position:sticky;top:63px;max-height:calc(100vh - 63px);overflow-y:auto;border-right:1px solid var(--line);padding:20px clamp(14px,1.5vw,20px) 60px;}
  .side::-webkit-scrollbar{width:8px} .side::-webkit-scrollbar-thumb{background:#26201a;border-radius:8px}
  .presets{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:22px}
  .preset{font-family:var(--font-mono);font-size:10.5px;letter-spacing:.06em;cursor:pointer;background:var(--panel);border:1px solid var(--line);color:var(--ink-soft);border-radius:999px;padding:.5em .8em;transition:.2s}
  .preset:hover{border-color:var(--amber);color:var(--warm)}
  .facet{border-top:1px solid var(--line);padding:14px 0}
  .facet__h{display:flex;justify-content:space-between;align-items:center;cursor:pointer;font-family:var(--font-mono);font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--ink-mut);}
  .facet__h b{color:var(--warm);font-weight:700}
  .facet__h .chev{transition:transform .25s} .facet.closed .chev{transform:rotate(-90deg)}
  .facet__body{margin-top:12px} .facet.closed .facet__body{display:none}
  .facet__find{width:100%;background:var(--panel);border:1px solid var(--line);border-radius:6px;color:var(--warm);font-family:var(--font-body);font-size:13px;padding:.5em .7em;margin-bottom:8px;}
  .facet__find:focus{outline:none;border-color:var(--amber)}
  .facet__list{max-height:230px;overflow-y:auto;display:flex;flex-direction:column;gap:2px;padding-right:4px}
  .facet__list::-webkit-scrollbar{width:6px} .facet__list::-webkit-scrollbar-thumb{background:#26201a;border-radius:6px}
  .opt{display:flex;align-items:center;gap:9px;cursor:pointer;padding:5px 6px;border-radius:5px;font-size:13.5px;color:var(--ink-soft);}
  .opt:hover{background:rgba(244,238,228,.04);color:var(--warm)}
  .opt input{appearance:none;width:15px;height:15px;border:1px solid var(--ink-mut);border-radius:4px;flex:0 0 auto;position:relative;cursor:pointer}
  .opt input:checked{background:var(--amber);border-color:var(--amber)}
  .opt input:checked::after{content:"";position:absolute;left:4px;top:1px;width:4px;height:8px;border:solid #1a1206;border-width:0 2px 2px 0;transform:rotate(45deg)}
  .opt .c{margin-left:auto;font-family:var(--font-mono);font-size:11px;color:var(--ink-mut)}
  .chips{display:flex;flex-wrap:wrap;gap:6px}
  .chip{font-family:var(--font-mono);font-size:11px;cursor:pointer;background:var(--panel);border:1px solid var(--line);color:var(--ink-soft);border-radius:999px;padding:.5em .8em;transition:.18s;display:inline-flex;gap:.5em;align-items:center}
  .chip .c{color:var(--ink-mut)} .chip:hover{border-color:var(--amber);color:var(--warm)}
  .chip.on{background:var(--amber);border-color:var(--amber);color:#1a1206;font-weight:700} .chip.on .c{color:#1a1206}
  .toggles{display:flex;flex-direction:column;gap:4px}
  .main{padding:18px clamp(16px,3vw,34px) 90px;min-width:0}
  .bar{display:flex;align-items:center;gap:16px;flex-wrap:wrap;margin-bottom:18px}
  .count{font-family:var(--font-display);font-weight:700;font-size:clamp(1.3rem,2.4vw,1.9rem);text-transform:uppercase;letter-spacing:.01em}
  .count b{color:var(--amber)}
  .sort{margin-left:auto;display:flex;align-items:center;gap:8px;font-family:var(--font-mono);font-size:11px;color:var(--ink-mut);text-transform:uppercase;letter-spacing:.1em}
  .sort select{background:var(--panel);border:1px solid var(--line);color:var(--warm);border-radius:6px;padding:.5em .6em;font-family:var(--font-mono);font-size:11px}
  .active-tags{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:16px}
  .atag{font-family:var(--font-mono);font-size:10.5px;background:rgba(240,162,60,.12);border:1px solid rgba(240,162,60,.4);color:var(--amber-hi);border-radius:999px;padding:.4em .7em;cursor:pointer;display:inline-flex;gap:.5em;align-items:center}
  .atag:hover{background:rgba(240,162,60,.2)} .atag::after{content:"\00d7"}
  .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(290px,1fr));gap:12px}
  .card{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:16px 17px;display:flex;flex-direction:column;gap:10px;transition:border-color .2s,transform .2s}
  .card:hover{border-color:rgba(240,162,60,.5);transform:translateY(-2px)}
  .card__top{display:flex;justify-content:space-between;gap:10px;align-items:flex-start}
  .card__name{font-family:var(--font-display);font-weight:700;font-size:1.15rem;line-height:1.05;text-transform:uppercase;letter-spacing:.01em}
  .card__role{color:var(--ink-mut);font-size:12px;margin-top:2px}
  .badge{font-family:var(--font-mono);font-size:9.5px;letter-spacing:.1em;padding:.35em .55em;border-radius:4px;border:1px solid var(--line);color:var(--ink-mut);flex:0 0 auto;white-space:nowrap}
  .badge--3d{color:var(--amber-hi);border-color:rgba(240,162,60,.5)}
  .card__style{display:flex;flex-wrap:wrap;gap:5px}
  .stag{font-family:var(--font-mono);font-size:10px;background:rgba(244,238,228,.06);border-radius:4px;padding:.35em .6em;color:var(--ink-soft)}
  .card__meta{font-size:12.5px;color:var(--ink-soft);display:flex;flex-direction:column;gap:3px}
  .card__meta .k{color:var(--ink-mut);font-family:var(--font-mono);font-size:10px;letter-spacing:.08em;text-transform:uppercase;margin-right:.5em}
  .card__foot{display:flex;gap:8px;margin-top:auto;padding-top:6px}
  .card__foot a,.card__foot button{flex:1;text-align:center;font-family:var(--font-mono);font-size:10.5px;letter-spacing:.08em;text-transform:uppercase;border:1px solid var(--line);border-radius:6px;padding:.6em;color:var(--ink-soft);background:none;cursor:pointer;transition:.2s;text-decoration:none}
  .card__foot a:hover,.card__foot button:hover{border-color:var(--amber);color:var(--amber-hi)}
  .empty{text-align:center;padding:80px 20px;color:var(--ink-mut)}
  .empty h3{font-family:var(--font-display);font-weight:700;font-size:1.6rem;color:var(--warm);text-transform:uppercase}
  .more{text-align:center;padding:24px;color:var(--ink-mut);font-family:var(--font-mono);font-size:12px}
  .live{font-family:var(--font-mono);font-size:10px;letter-spacing:.1em;text-transform:uppercase;color:var(--ink-mut);padding:0 clamp(16px,3vw,34px) 0}
  .card__shot{aspect-ratio:16/10;border-radius:7px;overflow:hidden;position:relative;background:#141017;background-image:linear-gradient(110deg,#141017 30%,#1d1620 50%,#141017 70%);background-size:220% 100%;animation:shimmer 1.4s linear infinite;}
  .card__shot.is-ready{animation:none;background:#0c0a08;}
  .card__shot.is-fail{display:none;}
  .card__shot img{width:100%;height:100%;object-fit:cover;object-position:top center;display:block;opacity:0;transition:opacity .45s ease;}
  .card__shot.is-ready img{opacity:1;}
  @keyframes shimmer{to{background-position:-220% 0;}}
  /* ---------- BOOKING MODAL ---------- */
  .bk{position:fixed;inset:0;z-index:120;display:flex;align-items:flex-start;justify-content:center;padding:5vh 18px;overflow-y:auto;}
  .bk[hidden]{display:none;}
  .bk__scrim{position:fixed;inset:0;background:rgba(4,4,6,.74);backdrop-filter:blur(6px);}
  .bk__panel{position:relative;z-index:1;width:min(520px,100%);background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:26px 26px 30px;}
  .bk__x{position:absolute;top:10px;right:14px;background:none;border:none;color:var(--ink-mut);font-size:26px;line-height:1;cursor:pointer;}
  .bk__x:hover{color:var(--amber-hi);}
  .bk__name{font-family:var(--font-display);font-weight:700;text-transform:uppercase;font-size:1.5rem;line-height:1;color:var(--warm);}
  .bk__role{color:var(--ink-mut);font-size:12px;margin:4px 0 6px;}
  .bk h4{font-family:var(--font-mono);font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--amber);margin:20px 0 10px;display:flex;align-items:center;gap:.6em;}
  .bk h4::before{content:"";width:20px;height:1px;background:var(--amber);}
  .bk__row{display:flex;gap:10px;flex-wrap:wrap;}
  .bk label{display:flex;flex-direction:column;gap:5px;font-family:var(--font-mono);font-size:10px;letter-spacing:.08em;text-transform:uppercase;color:var(--ink-mut);flex:1;min-width:130px;}
  .bk input,.bk select{background:#141017;border:1px solid var(--line);border-radius:6px;color:var(--warm);font-family:var(--font-body);font-size:14px;padding:.55em .7em;color-scheme:dark;}
  .bk input:focus,.bk select:focus{outline:none;border-color:var(--amber);}
  .bk__prev{background:#0c0a08;border:1px solid var(--line);border-radius:8px;padding:12px 14px;font-size:12.5px;color:var(--ink-soft);white-space:pre-wrap;line-height:1.5;margin-top:10px;max-height:150px;overflow:auto;font-family:var(--font-body);}
  .bk__btn{width:100%;margin-top:14px;background:var(--amber);color:#1a1206;border:none;border-radius:7px;font-family:var(--font-mono);font-size:12px;letter-spacing:.1em;text-transform:uppercase;font-weight:700;padding:.9em;cursor:pointer;transition:.15s;}
  .bk__btn:hover{background:var(--amber-hi);}
  .bk__div{border-top:1px solid var(--line);margin-top:22px;}
  .bk__msg{font-family:var(--font-mono);font-size:11px;color:var(--amber-hi);margin-top:12px;min-height:1em;text-align:center;}
  /* status badges */
  .card__badges{display:flex;flex-direction:column;gap:5px;align-items:flex-end;flex:0 0 auto;}
  .stbadge{font-family:var(--font-mono);font-size:9px;letter-spacing:.06em;padding:.35em .5em;border-radius:4px;border:1px solid;white-space:nowrap;text-transform:uppercase;}
  .st-check{color:#6f9be6;border-color:rgba(111,155,230,.55);background:rgba(111,155,230,.12);}
  .st-hold{color:#f0c14b;border-color:rgba(240,193,75,.55);background:rgba(240,193,75,.12);}
  .st-book{color:#58c39a;border-color:rgba(88,195,154,.55);background:rgba(88,195,154,.12);}
  .st-na{color:#ff6b5c;border-color:rgba(255,107,92,.55);background:rgba(255,107,92,.12);}
  .st-neutral{color:var(--ink-mut);border-color:var(--line);}
</style>
</head>

        ps:g(r,iPs),ss:g(r,iSs),rn:rn,os:g(r,iOs),rt:num(g(r,iRt)),cu:g(r,iCu),pr:g(r,iPr),st:g(r,iSt),co:null,d3:null,dim:null}); });
    return out; }

  var ALL=[], state={q:'',style:new Set(),role:new Set(),sw:new Set(),rn:new Set(),co:new Set(),d3:false,pf:false,active:false,sort:'name'};
  var cStyle,cRole,cCo,cSw,cRn, fx=document.getElementById('facets');
  var FX=null;
  fetch(FX_URL).then(function(r){return r.json();}).then(function(d){if(d&&(d.rates||d.conversion_rates)){FX=d.rates||d.conversion_rates;render();}}).catch(function(){});
  function toUSD(rt,cu){ if(!rt||!FX) return null; var code=(''+(cu||'')).trim().slice(0,3).toUpperCase(); if(!code||code==='USD') return null; var r=FX[code]; if(!r) return null; return Math.round(rt/r); }

  function counts(get){ var m={}; ALL.forEach(function(a){ get(a).forEach(function(v){ if(v) m[v]=(m[v]||0)+1; }); }); return m; }
  function reset(){ state.q='';var qi=document.getElementById('q');if(qi)qi.value='';state.style.clear();state.role.clear();state.sw.clear();state.rn.clear();state.co.clear();state.d3=false;state.pf=false;state.active=false; }

  var PRESETS=[
    {label:'Sports packages',apply:function(){reset();['Sports','Network Packages'].forEach(function(s){state.style.add(s);});}},
    {label:'3D / C4D',apply:function(){reset();state.d3=true;state.sw.add('Cinema 4D');}},
    {label:'Houdini FX',apply:function(){reset();state.sw.add('Houdini');}},
    {label:'2D animation',apply:function(){reset();Object.keys(cRole).forEach(function(r){if(r.toLowerCase().indexOf('2d')>-1)state.role.add(r);});}},
    {label:'Art directors',apply:function(){reset();state.role.add('Art Director');state.role.add('Creative Director');}},
    {label:'Titles',apply:function(){reset();state.style.add('Titles');}}
  ];

  function facetChips(title,set,cmap){ var keys=Object.keys(cmap).sort(function(a,b){return cmap[b]-cmap[a];});
    var wrap=document.createElement('div');wrap.className='facet';
    wrap.innerHTML='<div class="facet__h"><span><b>'+title+'</b></span><span class="chev">▾</span></div>';
    var body=document.createElement('div');body.className='facet__body';var chips=document.createElement('div');chips.className='chips';
    keys.forEach(function(k){var c=document.createElement('button');c.className='chip'+(set.has(k)?' on':'');c.innerHTML=k+' <span class="c">'+cmap[k]+'</span>';
      c.onclick=function(){set.has(k)?set.delete(k):set.add(k);render();};chips.appendChild(c);});
    body.appendChild(chips);wrap.appendChild(body);wrap.querySelector('.facet__h').onclick=function(){wrap.classList.toggle('closed');};return wrap; }
  function facetList(title,set,cmap,searchable,closed){ var keys=Object.keys(cmap).sort(function(a,b){return cmap[b]-cmap[a];});
    var wrap=document.createElement('div');wrap.className='facet'+(closed?' closed':'');
    wrap.innerHTML='<div class="facet__h"><span><b>'+title+'</b></span><span class="chev">▾</span></div>';
    var body=document.createElement('div');body.className='facet__body';
    if(searchable){var f=document.createElement('input');f.className='facet__find';f.placeholder='Filter '+title.toLowerCase()+'…';
      f.oninput=function(){list.querySelectorAll('.opt').forEach(function(o){o.style.display=o.dataset.k.toLowerCase().indexOf(f.value.toLowerCase())>-1?'':'none';});};body.appendChild(f);}
    var list=document.createElement('div');list.className='facet__list';
    keys.forEach(function(k){var o=document.createElement('label');o.className='opt';o.dataset.k=k;
      o.innerHTML='<input type="checkbox" '+(set.has(k)?'checked':'')+'><span>'+k+'</span><span class="c">'+cmap[k]+'</span>';
      o.querySelector('input').onchange=function(){set.has(k)?set.delete(k):set.add(k);render();};list.appendChild(o);});
    body.appendChild(list);wrap.appendChild(body);wrap.querySelector('.facet__h').onclick=function(e){if(e.target.tagName!=='INPUT')wrap.classList.toggle('closed');};return wrap; }
  function facetToggles(){ var wrap=document.createElement('div');wrap.className='facet';
    wrap.innerHTML='<div class="facet__h"><span><b>Quick filters</b></span><span class="chev">▾</span></div>';
    var body=document.createElement('div');body.className='facet__body';var t=document.createElement('div');t.className='toggles';
    [['d3','3D artists only'],['pf','Has portfolio'],['active','Active only (hide dead)']].forEach(function(p){
      var o=document.createElement('label');o.className='opt';o.innerHTML='<input type="checkbox" '+(state[p[0]]?'checked':'')+' data-t="'+p[0]+'"><span>'+p[1]+'</span>';
      o.querySelector('input').onchange=function(e){state[p[0]]=e.target.checked;render();};t.appendChild(o);});
    body.appendChild(t);wrap.appendChild(body);wrap.querySelector('.facet__h').onclick=function(e){if(e.target.tagName!=='INPUT')wrap.classList.toggle('closed');};return wrap; }

  function buildFacets(){ fx.innerHTML='';
    fx.appendChild(facetChips('Style',state.style,cStyle));
    fx.appendChild(facetToggles());
    fx.appendChild(facetList('Discipline',state.role,cRole,true,false));
    fx.appendChild(facetList('Software',state.sw,cSw,true,true));
    fx.appendChild(facetList('Render',state.rn,cRn,false,true));
    fx.appendChild(facetList('Country',state.co,cCo,true,true)); }

  function matches(a){
    if(state.q){var q=state.q.toLowerCase(); if((a.n+' '+a.ro+' '+a.ps+' '+a.ss+' '+a.os+' '+a.rn+' '+a.lo+' '+a.em+' '+a.sy).toLowerCase().indexOf(q)<0) return false;}
    if(state.style.size&&!state.style.has(a.sy)) return false;
    if(state.role.size&&!state.role.has(a.ro)) return false;
    if(state.co.size&&!state.co.has(a.co)) return false;
    if(state.rn.size){var ok=false;state.rn.forEach(function(r){if((a.rn||'').toLowerCase()===r.toLowerCase())ok=true;});if(!ok)return false;}
    if(state.sw.size){var b=swblob(a),ok2=false;state.sw.forEach(function(s){var e=SOFTWARE.find(function(x){return x[0]===s;});if(e&&b.indexOf(e[1])>-1)ok2=true;});if(!ok2)return false;}
    if(state.d3&&!a.d3) return false;
    if(state.pf&&!a.pf) return false;
    if(state.active&&(a.st||'').toLowerCase()==='dead') return false;
    return true; }
  var shotIO=('IntersectionObserver' in window)?new IntersectionObserver(function(es){es.forEach(function(e){if(e.isIntersecting){loadShot(e.target);shotIO.unobserve(e.target);}});},{rootMargin:'900px'}):null;
  function loadShot(el){var u=el.dataset.shot;if(!u||el.dataset.done)return;el.dataset.done=1;var img=new Image();img.alt='';img.referrerPolicy='no-referrer';img.onload=function(){el.appendChild(img);el.classList.add('is-ready');};img.onerror=function(){el.classList.add('is-fail');};img.src=SHOT(u);}
  function mountShots(){var s=document.querySelectorAll('.card__shot[data-shot]');if(!shotIO){[].forEach.call(s,loadShot);return;}[].forEach.call(s,function(el){shotIO.observe(el);});}
  var LIMIT=400;
  function stClass(s){ s=(''+(s||'')).toLowerCase();
    if(s.indexOf('check')>-1) return 'st-check';
    if(s.indexOf('hold')>-1) return 'st-hold';
    if(s.indexOf('book')>-1||s.indexOf('award')>-1||s.indexOf('deliver')>-1) return 'st-book';
    if(s.indexOf('not available')>-1||s==='dead') return 'st-na';
    return 'st-neutral'; }
  function esc(s){return(''+(s||'')).replace(/[&<>"]/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c];});}
  function card(a){var el=document.createElement('div');el.className='card';var sw=[a.ps,a.ss,a.rn].filter(Boolean).join(' · ');
    var rate=a.rt?('$'+a.rt.toLocaleString()+' '+(a.cu||'').replace(/[^A-Za-z]/g,'')+' /'+(a.pr||'day').toLowerCase()):'Rate on ask';
    var usd=toUSD(a.rt,a.cu); if(usd) rate+=' · ≈ $'+usd.toLocaleString()+' USD';
    el.innerHTML=(PREVIEW&&a.pf?'<div class="card__shot" data-shot="'+esc(a.pf)+'"></div>':'')+'<div class="card__top"><div><div class="card__name">'+esc(a.n)+'</div><div class="card__role">'+esc(a.ro||'—')+'</div></div>'+
      '<div class="card__badges">'+(a.d3?'<span class="badge badge--3d">3D</span>':(a.dim?'<span class="badge">'+a.dim+'</span>':''))+(a.st?'<span class="stbadge '+stClass(a.st)+'">'+esc(a.st)+'</span>':'')+'</div></div>'+
      (a.sy?'<div class="card__style"><span class="stag">'+esc(a.sy)+'</span></div>':'')+
      '<div class="card__meta">'+(sw?'<div><span class="k">Software</span>'+esc(sw)+'</div>':'')+
      (a.lo?'<div><span class="k">Based</span>'+esc(a.lo)+'</div>':'')+'<div><span class="k">Rate</span>'+esc(rate)+'</div></div>'+
      '<div class="card__foot">'+(a.pf?'<a href="'+esc(a.pf)+'" target="_blank" rel="noopener">Portfolio ↗</a>':'')+
      (a.em?'<button class="book-btn">Check availability</button>':'')+'</div>';
    var bk=el.querySelector('.book-btn');if(bk)bk.onclick=function(){openBooking(a);};return el; }
  function renderTags(){var box=document.getElementById('activeTags');box.innerHTML='';
    function add(l,fn){var t=document.createElement('button');t.className='atag';t.textContent=l;t.onclick=function(){fn();render();};box.appendChild(t);}
    state.style.forEach(function(v){add('Style: '+v,function(){state.style.delete(v);});});
    state.role.forEach(function(v){add(v,function(){state.role.delete(v);});});
    state.sw.forEach(function(v){add(v,function(){state.sw.delete(v);});});
    state.rn.forEach(function(v){add('Render: '+v,function(){state.rn.delete(v);});});
    state.co.forEach(function(v){add(v,function(){state.co.delete(v);});});
    if(state.d3)add('3D only',function(){state.d3=false;});
    if(state.pf)add('Has portfolio',function(){state.pf=false;});
    if(state.active)add('Active only',function(){state.active=false;}); }
  function render(){var res=ALL.filter(matches);
    if(state.sort==='name')res.sort(function(a,b){return a.n.localeCompare(b.n);});
    else if(state.sort==='rate_lo')res.sort(function(a,b){return (a.rt||1e9)-(b.rt||1e9);});
    else if(state.sort==='rate_hi')res.sort(function(a,b){return (b.rt||-1)-(a.rt||-1);});
    document.getElementById('count').innerHTML='<b>'+res.length.toLocaleString()+'</b> artist'+(res.length===1?'':'s');
    renderTags();var grid=document.getElementById('grid');grid.innerHTML='';
    if(!res.length){grid.innerHTML='<div class="empty" style="grid-column:1/-1"><h3>No matches</h3><p>Loosen a filter or clear the style / discipline selection.</p></div>';window.__res=res;return;}
    var frag=document.createDocumentFragment();res.slice(0,LIMIT).forEach(function(a){frag.appendChild(card(a));});grid.appendChild(frag);mountShots();
    if(res.length>LIMIT){var m=document.createElement('div');m.className='more';m.style.gridColumn='1/-1';m.textContent='Showing first '+LIMIT+' of '+res.length+' — refine filters to narrow the list.';grid.appendChild(m);}
    window.__res=res; }

  function initData(list){ ALL=list.map(derive);
    cStyle=counts(function(a){return[a.sy];}); cRole=counts(function(a){return[a.ro];}); cCo=counts(function(a){return[a.co];});
    cSw={};SOFTWARE.forEach(function(s){cSw[s[0]]=ALL.filter(function(a){return swblob(a).indexOf(s[1])>-1;}).length;});
    cRn={};RENDER.forEach(function(r){cRn[r]=ALL.filter(function(a){return(a.rn||'').toLowerCase()===r.toLowerCase();}).length;});
    buildFacets(); render(); }

  /* presets */
  var pe=document.getElementById('presets');
  PRESETS.forEach(function(p){var b=document.createElement('button');b.className='preset';b.textContent=p.label;b.onclick=function(){p.apply();buildFacets();render();};pe.appendChild(b);});
  /* events */
  var prevBtn=document.getElementById('prev');prevBtn.classList.toggle('btn--amber',PREVIEW);prevBtn.onclick=function(){PREVIEW=!PREVIEW;prevBtn.classList.toggle('btn--amber',PREVIEW);render();};
  var qi=document.getElementById('q'),qt;qi.oninput=function(){clearTimeout(qt);qt=setTimeout(function(){state.q=qi.value;render();},120);};
  document.getElementById('sort').onchange=function(e){state.sort=e.target.value;render();};
  document.getElementById('clear').onclick=function(){reset();state.sort='name';document.getElementById('sort').value='name';buildFacets();render();};
  document.getElementById('export').onclick=function(){var res=window.__res||ALL;
    var cols=['Name','Role','Style','Primary SW','Secondary SW','Render','Other SW','Location','Country','Email','Portfolio','Rate','Currency','Per','3D','Status'];
    var lines=[cols.join(',')];res.forEach(function(a){lines.push([a.n,a.ro,a.sy,a.ps,a.ss,a.rn,a.os,a.lo,a.co,a.em,a.pf,a.rt||'',a.cu,a.pr,a.d3?'Yes':'',a.st].map(function(v){v=(v==null?'':''+v);return '"'+v.replace(/"/g,'""')+'"';}).join(','));});
    var blob=new Blob([lines.join('\n')],{type:'text/csv'}),u=URL.createObjectURL(blob),l=document.createElement('a');l.href=u;l.download='extension-shortlist.csv';l.click();URL.revokeObjectURL(u);};

  initData(EMBED);
  var live=document.getElementById('live');
  if(SHEET_CSV_URL){ live.textContent='Syncing with live sheet…';
    fetch(SHEET_CSV_URL).then(function(r){return r.text();}).then(function(t){var m=mapCSV(t);if(m.length){initData(m);live.textContent='Live · synced with sheet ('+m.length.toLocaleString()+' artists)';}else{live.textContent='Snapshot ('+EMBED.length.toLocaleString()+' artists)';}}).catch(function(){live.textContent='Snapshot ('+EMBED.length.toLocaleString()+' artists) — live sheet unreachable';});
  } else { live.textContent='Snapshot ('+EMBED.length.toLocaleString()+' artists) — set SHEET_CSV_URL to sync live'; }

  /* ===== booking / availability workflow ===== */
  var CUR=null;
  function d2(s,e){ if(s&&e) return s+' \u2013 '+e; return s||e||'[dates]'; }
  function reqEmail(a,s,e){ return {subject:'Extension \u2014 Availability check',
    body:'Hello '+a.n+',\n\nWe\'re looking for '+(a.ro||'creative')+' support on a project for the following dates: '+d2(s,e)+'. Do you have availability?\n\nThanks,'}; }
  function holdEmail(a,type,s,e,rate){ var verb=type==='Booking'?'book you for':(type==='1st Hold'?'place a first hold for':'place a second hold for');
    return {subject:'Extension \u2014 '+type+' ['+d2(s,e)+']',
    body:'Hi '+a.n+',\n\nWe would like to '+verb+' the following dates: '+d2(s,e)+(rate?' at '+rate:'')+'.\n\nPlease confirm.\n\nThanks,'}; }
  function post(payload){ if(BOOKING_ENDPOINT){ fetch(BOOKING_ENDPOINT,{method:'POST',mode:'no-cors',body:JSON.stringify(payload)}); return true; } return false; }
  function mailto(to,em){ window.location.href='mailto:'+encodeURIComponent(to)+'?subject='+encodeURIComponent(em.subject)+'&body='+encodeURIComponent(em.body); }
  function bkMsg(t){ var m=document.getElementById('bkMsg'); if(m) m.textContent=t; }
  function g(id){ return document.getElementById(id); }
  function openBooking(a){ CUR=a;
    g('bkName').textContent=a.n; g('bkRole').textContent=(a.ro||'')+(a.lo?'  \u00b7  '+a.lo:'');
    ['bkStart','bkEnd','bkEarliest','bkHStart','bkHEnd'].forEach(function(id){g(id).value='';});
    g('bkRate').value = a.rt?('$'+a.rt.toLocaleString()+' '+(a.cu||'').replace(/[^A-Za-z]/g,'')+' /'+(a.pr||'day').toLowerCase()):'';
    g('bkStatus').value=''; g('bkEarliestWrap').style.display='none'; g('bkHoldWrap').style.display='none';
    bkMsg(''); reqPrev(); g('bookModal').hidden=false;
  }
  function reqPrev(){ if(!CUR)return; g('bkReqPrev').textContent=reqEmail(CUR,g('bkStart').value,g('bkEnd').value).body; }
  function holdPrev(){ if(!CUR)return; var st=g('bkStatus').value; if(st==='1st Hold'||st==='2nd Hold'||st==='Booking'){ g('bkHoldPrev').textContent=holdEmail(CUR,st,g('bkHStart').value,g('bkHEnd').value,g('bkRate').value).body; } }
  ['bkStart','bkEnd'].forEach(function(id){ g(id).addEventListener('input',reqPrev); });
  ['bkHStart','bkHEnd','bkRate'].forEach(function(id){ g(id).addEventListener('input',holdPrev); });
  g('bkStatus').addEventListener('change',function(e){ var v=e.target.value;
    g('bkEarliestWrap').style.display=(v==='Earliest available'||v==='Not available')?'flex':'none';
    g('bkHoldWrap').style.display=(v==='1st Hold'||v==='2nd Hold'||v==='Booking')?'block':'none'; holdPrev(); });
  g('bkSendReq').onclick=function(){ if(!CUR)return; var s=g('bkStart').value,e=g('bkEnd').value,em=reqEmail(CUR,s,e);
    if(!BOOKING_ENDPOINT){ bkMsg('Not connected yet \u2014 add your Apps Script URL to BOOKING_ENDPOINT.'); return; }
    post({to:CUR.em,name:CUR.n,sendEmail:true,subject:em.subject,body:em.body,update:{Status:'Checking Availability'}});
    CUR.st='Checking Availability'; render(); bkMsg('Sent from thomas@extstudio.com \u2713'); };
  g('bkSave').onclick=function(){ if(!CUR)return; var st=g('bkStatus').value; if(!st){ bkMsg('Pick a status first.'); return; }
    var update={Status:st}, em=null;
    if(st==='Earliest available'||st==='Not available'){ update['Earliest Availability - Start']=g('bkEarliest').value; }
    else { var s=g('bkHStart').value,e=g('bkHEnd').value,r=g('bkRate').value;
      if(st==='1st Hold'){ update['1st Hold - Start']=s; update['1st Hold - End']=e; }
      if(st==='2nd Hold'){ update['2nd Hold - Start']=s; update['2nd Hold - End']=e; }
      if(st==='Booking'){ update['Booking - Start']=s; update['Booking - End']=e; }
      em=holdEmail(CUR,st,s,e,r);
    }
    if(!BOOKING_ENDPOINT){ bkMsg('Not connected yet \u2014 add your Apps Script URL to BOOKING_ENDPOINT.'); return; }
    post({to:CUR.em,name:CUR.n,sendEmail:!!em,subject:em?em.subject:'',body:em?em.body:'',update:update});
    CUR.st=st; render(); bkMsg('Saved'+(em?' \u00b7 '+st+' email sent from thomas@extstudio.com':'')+' \u2713'); };
  document.querySelectorAll('[data-bk-close]').forEach(function(b){ b.addEventListener('click',function(){ g('bookModal').hidden=true; }); });
  document.addEventListener('keydown',function(e){ if(e.key==='Escape'){ var m=g('bookModal'); if(m&&!m.hidden) m.hidden=true; } });

})();
</script>
